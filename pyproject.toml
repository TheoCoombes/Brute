[build-system]
requires = ["scikit-build-core >= 0.4.3"]
build-backend = "scikit_build_core.build"

[project]
name = "brute"
version = "0.0.1"
description = "1-bit tensor library built on PyTorch."
readme = "README.md"
dependencies = ["torch >= 2.0"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["brute"]

# Install with: pip install --no-build-isolation -ve .
# (--no-build-isolation so the build can find the already-installed torch)

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/fuzz", "tests/stress"]
pythonpath = ["."]
addopts = "-v --tb=short -ra"
filterwarnings = ["ignore::UserWarning"]
python_files = ["test_*.py", "bench_*.py"]
markers = [
    "slow: marks tests as slow",
    "stress: long-running stress tests",
    "fuzz: hypothesis-driven fuzz tests",
    "cuda: requires CUDA",
    "mps: requires MPS",
    "needs_dispatch_parity: requires bit1 dispatch parity with torch.bool",
]
# Benchmark defaults — when running `pytest tests/benchmarks --benchmark-only`,
# results are auto-grouped by op (group=...) and sorted by name so scales read
# dispatch→huge top-to-bottom. Override on the CLI if needed.
#
# Recommended single-run invocation:
#   pytest tests/benchmarks --benchmark-only \
#       --benchmark-group-by=group --benchmark-sort=name \
#       --benchmark-json=.benchmarks/$(date +%Y%m%d_%H%M).json
#
# Then render the report:
#   python -m tests.benchmarks.make_report
#
# Version comparison (head vs base):
#   python -m tests.benchmarks.make_report base.json head.json -o diff.md
